<!DOCTYPE html>
<html lang="en"> <!-- Default lang, JS will update -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visa Information Assistant</title> <!-- JS will update -->
    <!-- Removed Fontshare CDN link placeholder as we are using local fonts -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="site-header-content">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Visa Assistant Logo" class="logo-img"> 
            <h1 class="site-title" data-translate-key="mainHeader">Visa Information Assistant</h1>
            <div class="language-selector">
                <select name="language" id="languageSwitcher" onchange="switchLanguage(this.value)">
                    <option value="fr">Français</option>
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
        </div>
    </header>

    <main id="chatContainer"> 
        <div class="main-content-wrapper"> 
            <div class="chat-area-wrapper"> <!-- Chat area now comes first in HTML for left placement -->
                <div class="chat-box">
                    <div class="chat-window" id="chatWindow"> 
                        <div class="chat-header-controls">
                            <span id="resetSessionBtn" class="chat-control-icon" title="Reset Session">&#x21BB;</span>
                        </div>
                        <div id="chatHistory" class="chat-history">
                            <!-- Messages will be appended here by JavaScript -->
                        </div>
                    </div>
                    <div class="prompts"> 
                        <button class="prompt-chip" onclick="handleVisaDocSuggestion()" data-translate-key="suggestionVisaDocs">Documents visa ?</button>
                        <button class="prompt-chip" onclick="handleCountryVisaSuggestion()" data-translate-key="suggestionCountryVisa">Visa pays ?</button>
                    </div>
                    <div class="input-row"> 
                        <input type="text" id="queryInput" placeholder="Posez votre question..." data-translate-key="queryPlaceholder">
                        <button id="sendButton" onclick="sendQuery()" data-translate-key="sendBtn">Send</button>
                    </div>
                </div>
            </div>
            <aside class="sidebar"> <!-- Sidebar now comes second for right placement -->
                <span id="sidebarToggleIcon" class="sidebar-toggle-icon" title="Toggle Sidebar">&laquo;</span>
                <h3 data-translate-key="toolsTitle">Tools</h3>
                <div class="actions"> 
                    <button class="action-button" onclick="openAddDocModal()" data-translate-key="addDocBtn">Add Document</button>
                    <button class="action-button" onclick="openCreateCorpusModal()" data-translate-key="createCorpusBtn">Create Corpus</button>
                    <button class="action-button" onclick="openListItemModal()" data-translate-key="listItemBtn">List Items</button>
                    <button class="action-button delete-button" onclick="openDeleteModal()" data-translate-key="deleteItemBtn">Delete Item</button>
                </div>
            </aside>
        </div>
    </main>

    <!-- Modals will be placed here by the next edit or should remain if already outside app-container -->
    <!-- Add Document Modal -->
    <div id="addDocModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeAddDocModal()">&times;</span>
            <h2 data-translate-key="addDocModalTitle">Ajouter Document au Corpus</h2>
            <label for="docLink" data-translate-key="addDocLinkModalLabel">Lien/Chemin du Document :</label>
            <input type="text" id="docLink" name="docLink" placeholder="ex: https://exemple.com/doc.pdf ou /chemin/vers/fichier.txt" data-translate-key="addDocLinkModalPlaceholder">
            <label for="corpusName" data-translate-key="addDocCorpusModalLabel">Nom du Corpus :</label>
            <input type="text" id="corpusName" name="corpusName" placeholder="ex: 'PolitiquesVoyage'" data-translate-key="addDocCorpusModalPlaceholder">
            <button id="submitAddDoc" data-translate-key="addDocModalBtn">Ajouter Document</button>
        </div>
    </div>

    <!-- Delete Item Modal -->
    <div id="deleteItemModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeDeleteModal()">&times;</span>
            <h2 data-translate-key="deleteModalTitle">Supprimer Élément de la Base de Connaissances</h2>
            
            <div class="radio-group">
                <label><input type="radio" name="deleteType" value="document" checked onchange="toggleDeleteCorpusNameField()"><span data-translate-key="deleteTypeDocRadio"> Document</span></label>
                <label><input type="radio" name="deleteType" value="corpus" onchange="toggleDeleteCorpusNameField()"><span data-translate-key="deleteTypeCorpusRadio"> Corpus</span></label>
            </div>

            <label for="itemName" id="itemNameLabel" data-translate-key="deleteItemNameLabelDoc">Nom du Document :</label>
            <input type="text" id="itemName" name="itemName" placeholder="Entrez le nom de l\'élément à supprimer" data-translate-key="deleteItemNamePlaceholder">
            
            <div id="deleteCorpusNameContainer">
                <label for="deleteCorpusName" data-translate-key="deleteCorpusNameLabel">Nom du Corpus (pour document) :</label>
                <input type="text" id="deleteCorpusName" name="deleteCorpusName" placeholder="Entrez le nom du corpus" data-translate-key="deleteCorpusNamePlaceholder">
            </div>
            
            <button id="submitDeleteItem" class="delete-confirm" data-translate-key="deleteModalBtn">Confirmer Suppression</button>
        </div>
    </div>

    <!-- Create Corpus Modal -->
    <div id="createCorpusModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeCreateCorpusModal()">&times;</span>
            <h2 data-translate-key="createCorpusModalTitle">Créer Nouveau Corpus</h2>
            <label for="newCorpusName" data-translate-key="createCorpusNameModalLabel">Nom du Corpus :</label>
            <input type="text" id="newCorpusName" name="newCorpusName" placeholder="Entrez le nom du nouveau corpus" data-translate-key="createCorpusNameModalPlaceholder">
            <button id="submitCreateCorpus" data-translate-key="createCorpusModalBtn">Créer Corpus</button>
        </div>
    </div>

    <!-- List Item Modal -->
    <div id="listItemModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeListItemModal()">&times;</span>
            <h2 data-translate-key="listItemModalTitle">Lister Éléments</h2>
            <div class="radio-group">
                <label><input type="radio" name="listType" value="documentsInCorpus" checked onchange="toggleListItemCorpusNameField()"><span data-translate-key="listTypeDocsInCorpusRadio"> Documents du Corpus</span></label>
                <label><input type="radio" name="listType" value="allCorpora" onchange="toggleListItemCorpusNameField()"><span data-translate-key="listTypeAllCorporaRadio"> Noms de tous les Corpus</span></label>
            </div>
            <div id="listItemCorpusNameContainer">
                <label for="listCorpusName" data-translate-key="listCorpusNameModalLabel">Nom du Corpus :</label>
                <input type="text" id="listCorpusName" name="listCorpusName" placeholder="Entrez le nom du corpus" data-translate-key="listCorpusNameModalPlaceholder">
            </div>
            <button id="submitListItem" data-translate-key="listItemModalBtn">Lister</button>
        </div>
    </div>

        // --- Start of NEW Sidebar Toggle Script ---
        const sidebarToggleIcon = document.getElementById('sidebarToggleIcon');
        const mainContentWrapper = document.querySelector('.main-content-wrapper');
        // const sidebar = document.querySelector('.sidebar'); // For observation if needed

        // Ensure translations object exists (it should from previous steps)
        // We'll use the title attribute for "Hide/Show Tools" now, or change icon content

        let currentLangGlobal = 'en'; // Make sure this is correctly initialized by your existing logic

        function updateSidebarToggleIconState() {
            if (sidebarToggleIcon) {
                if (mainContentWrapper && mainContentWrapper.classList.contains('sidebar-hidden')) {
                    sidebarToggleIcon.innerHTML = '&raquo;'; // Icon to "open"
                    sidebarToggleIcon.title = translations[currentLangGlobal]?.showToolsBtn || "Show Tools";
                } else {
                    sidebarToggleIcon.innerHTML = '&laquo;'; // Icon to "close"
                    sidebarToggleIcon.title = translations[currentLangGlobal]?.toggleToolsBtn || "Hide Tools";
                     // When opening, ensure the icon is in its default 'close' position immediately
                    sidebarToggleIcon.style.transform = 'none'; // Reset any transform from hidden state
                     if (document.documentElement.dir === 'rtl') {
                        sidebarToggleIcon.style.left = '10px';
                        sidebarToggleIcon.style.right = 'auto';
                    } else {
                        sidebarToggleIcon.style.right = '10px';
                        sidebarToggleIcon.style.left = 'auto';
                    }

                }
            }
        }

        if (sidebarToggleIcon && mainContentWrapper) {
            sidebarToggleIcon.addEventListener('click', () => {
                const isCurrentlyHidden = mainContentWrapper.classList.contains('sidebar-hidden');
                mainContentWrapper.classList.toggle('sidebar-hidden');
                
                // Update icon and title
                if (isCurrentlyHidden) { // Means we are opening it
                    sidebarToggleIcon.innerHTML = '&laquo;'; // Change to "close" icon
                    sidebarToggleIcon.title = translations[currentLangGlobal]?.toggleToolsBtn || "Hide Tools";
                     // Reset icon position for open state
                    sidebarToggleIcon.style.transform = 'none';
                     if (document.documentElement.dir === 'rtl') {
                        sidebarToggleIcon.style.left = '10px';
                        sidebarToggleIcon.style.right = 'auto';
                    } else {
                        sidebarToggleIcon.style.right = '10px';
                        sidebarToggleIcon.style.left = 'auto';
                    }

                } else { // Means we are closing it
                    sidebarToggleIcon.innerHTML = '&raquo;'; // Change to "open" icon
                    sidebarToggleIcon.title = translations[currentLangGlobal]?.showToolsBtn || "Show Tools";
                     // CSS handles icon repositioning for hidden state, but JS sets the character
                }
            });
        }

        // --- Integrate with your existing switchLanguage function ---
        const originalPageSwitchLanguageForIcon = window.switchLanguage;

        window.switchLanguage = function(lang, fromDropdown = true) {
            if (typeof originalPageSwitchLanguageForIcon === 'function' && 
                originalPageSwitchLanguageForIcon !== window.switchLanguage) { // Prevent infinite recursion
                originalPageSwitchLanguageForIcon(lang);
            } else if (typeof applyLanguage === 'function' && originalPageSwitchLanguageForIcon === window.switchLanguage) {
                // If this function has been fully overridden, call applyLanguage directly
                // This scenario happens if the previous sidebar script completely replaced switchLanguage
                applyLanguage(lang);
            }


            currentLangGlobal = lang;
            updateSidebarToggleIconState(); // Update icon title on language change

            if (fromDropdown) {
                const languageSwitcherDropdown = document.getElementById('languageSwitcher');
                if (languageSwitcherDropdown) languageSwitcherDropdown.value = lang;
            }
            // Ensure other translation updates happen
            if (typeof updateAllModalTranslations === 'function') updateAllModalTranslations(lang);
            if (typeof updateInputPlaceholders === 'function') updateInputPlaceholders(lang);
        };
        // --- End of NEW Sidebar Toggle Script ---

        // Initial setup on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', () => {
            const languageSwitcherDropdown = document.getElementById('languageSwitcher');
            if (languageSwitcherDropdown) {
                currentLangGlobal = languageSwitcherDropdown.value;
            } else {
                currentLangGlobal = localStorage.getItem('preferredLanguage') || 'fr'; // Fallback
            }
            
            // Call the switchLanguage to set everything initially, including the icon title
            // Pass false if your switchLanguage could cause a loop or if applyLanguage is sufficient
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(currentLangGlobal, false); 
            } else if (typeof applyLanguage === 'function') { // Fallback if switchLanguage isn't fully set up yet
                applyLanguage(currentLangGlobal);
                updateSidebarToggleIconState(); // Still need to update icon specifically
            }


            // Ensure the main content is not hidden by default (remove class if present from previous state)
            // Or, set initial icon state based on class
            if(mainContentWrapper) { // Add this check
               updateSidebarToggleIconState();
            }

            // Reset Session Button Logic
            const resetBtn = document.getElementById('resetSessionBtn');
            if (resetBtn) {
                resetBtn.addEventListener('click', async () => {
                    // 1. Clear chat history from UI
                    const chatHistoryDiv = document.getElementById('chatHistory');
                    if (chatHistoryDiv) {
                        chatHistoryDiv.innerHTML = '';
                    }

                    // 2. Call backend to reset session
                    try {
                        const response = await fetch('/reset_session', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });
                        const data = await response.json();
                        if (response.ok && data.message) {
                            console.log('Session reset successfully:', data.new_session_id);
                            // Optionally, display a system message in chat
                            appendMessage('System', 'New session started.', false);
                        } else {
                            console.error('Failed to reset session:', data.error);
                            appendMessage('System', 'Error: Could not start a new session. ' + (data.error || ''), false);
                        }
                    } catch (error) {
                        console.error('Error calling /reset_session:', error);
                        appendMessage('System', 'Error: Could not connect to server to start a new session.', false);
                    }
                });
            }
        });

        // Make sure these helper functions are defined (they were in the previous JS)
        // If not, you'll need to re-add or ensure they are defined elsewhere.
        // function updateAllModalTranslations(lang) { ... }
        // function updateInputPlaceholders(lang) { ... }
        // translations object should also be defined with toggleToolsBtn and showToolsBtn
        if (typeof translations !== 'undefined') {
            if (!translations.en) translations.en = {};
            translations.en.toggleToolsBtn = "Hide Tools";
            translations.en.showToolsBtn = "Show Tools";

            if (!translations.fr) translations.fr = {};
            translations.fr.toggleToolsBtn = "Masquer Outils";
            translations.fr.showToolsBtn = "Afficher Outils";

            if (!translations.ar) translations.ar = {};
            translations.ar.toggleToolsBtn = "إخفاء الأدوات";
            translations.ar.showToolsBtn = "إظهار الأدوات";
        } else {
            // console.error("Translations object is not defined!");
        }

        function applyLanguage(lang) {
            document.documentElement.lang = lang;
            document.title = translations[lang].pageTitle;

            if (lang === 'ar') {
                chatContainer.dir = 'rtl';
                document.body.style.textAlign = 'right'; // Basic RTL alignment for body
                 // Specific adjustments for elements if flex order needs to change or for text-align on block elements
                document.querySelectorAll('.modal-content h2, .modal-content label, .actions, .prompts, .input-row').forEach(el => el.style.textAlign = 'right');
                document.querySelectorAll('.close-button').forEach(el => el.style.float = 'left'); // Adjust close button for RTL
            } else {
                chatContainer.dir = 'ltr';
                document.body.style.textAlign = 'left';
                document.querySelectorAll('.modal-content h2, .modal-content label, .actions, .prompts, .input-row').forEach(el => el.style.textAlign = 'left');
                document.querySelectorAll('.close-button').forEach(el => el.style.float = 'right');
            }

            document.querySelectorAll('[data-translate-key]').forEach(element => {
                const key = element.getAttribute('data-translate-key');
                if (translations[lang][key]) {
                    if (element.tagName === 'TEXTAREA' || element.tagName === 'INPUT') {
                        if(element.type === 'radio') { 
                            // Already handled by span with data-translate-key
                        } else {
                            element.placeholder = translations[lang][key];
                        }
                    } else {
                        // For buttons, h1, h2, span, label - directly set textContent
                        // For radio button text, it's the span next to input that has the data-translate-key
                        element.textContent = translations[lang][key];
                    }
                }
            });
            toggleDeleteCorpusNameField(lang); 
            toggleListItemCorpusNameField(lang); // Assuming this also takes lang for consistency
        }

        function autoGrow(element) {
            if (!element) return;
            element.style.height = "5px";
            element.style.height = (element.scrollHeight) + "px";
            if (element.scrollHeight > 150) { 
                element.style.height = "150px";
                element.style.overflowY = "auto";
            } else {
                element.style.overflowY = "hidden";
            }
        }
        if(queryInput) {
            queryInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendQuery();
                }
            });
            queryInput.addEventListener('input', () => { 
                autoGrow(queryInput); 
                if(sendButton) sendButton.disabled = queryInput.value.trim() === "";
            });
        }

        function appendMessage(text, senderClass, isStreaming = false) {
            let messageElement;
            if (isStreaming && currentAgentMessageElement && senderClass === 'agent-message') {
                messageElement = currentAgentMessageElement;
                let p = messageElement.querySelector('p');
                if (!p) {
                    p = document.createElement('p');
                    messageElement.appendChild(p);
                }
                p.innerHTML += text; 
            } else {
                messageElement = document.createElement('div');
                messageElement.classList.add('message', senderClass);
                const p = document.createElement('p');
                if (senderClass === 'agent-message') {
                    p.innerHTML = text; 
                } else {
                    p.textContent = text; 
                }
                messageElement.appendChild(p);
                chatHistoryEl.appendChild(messageElement);

                if (senderClass === 'agent-message') {
                    currentAgentMessageElement = messageElement; 
                }
            }
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
            return messageElement;
        }
        
        function showLoaderInAgentMessage() {
            currentAgentMessageElement = document.createElement('div');
            currentAgentMessageElement.classList.add('message', 'agent-message');
            const p = document.createElement('p');
            currentAgentMessageElement.appendChild(p);
            const loaderDiv = document.createElement('div');
            loaderDiv.classList.add('loader-chat');
            p.appendChild(loaderDiv); 
            chatHistoryEl.appendChild(currentAgentMessageElement);
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
        }

        function removeLoaderFromAgentMessage() {
            if (currentAgentMessageElement) {
                const loader = currentAgentMessageElement.querySelector('.loader-chat');
                if (loader) {
                    loader.remove(); 
                }
            }
        }

        async function sendQuery() {
            const query = queryInput.value.trim();
            if (!query) return;

            const userMessageDiv = document.createElement('div');
            userMessageDiv.classList.add('message', 'user-message');
            const userP = document.createElement('p');
            userP.textContent = query;
            userMessageDiv.appendChild(userP);
            chatHistoryEl.appendChild(userMessageDiv);
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;

            queryInput.value = '';
            autoGrow(queryInput); 
            queryInput.focus();

            if(sendButton) sendButton.disabled = true;
            showLoaderInAgentMessage(); 

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                removeLoaderFromAgentMessage(); 

                if (!response.ok) {
                    let errorMsg = response.statusText;
                    try {
                        const errorData = await response.json(); 
                        errorMsg = errorData.error || errorData.message || JSON.stringify(errorData);
                    } catch (e) {
                        errorMsg = await response.text() || response.statusText;
                    }
                    if (!currentAgentMessageElement) currentAgentMessageElement = appendMessage("", 'agent-message');
                    let pTag = currentAgentMessageElement.querySelector('p');
                    if(!pTag) {pTag = document.createElement('p'); currentAgentMessageElement.appendChild(pTag);}
                    pTag.textContent = 'Error: ' + errorMsg;
                    return;
                }
                
                const data = await response.json();
                if (!currentAgentMessageElement) currentAgentMessageElement = appendMessage("", 'agent-message');
                let pTag = currentAgentMessageElement.querySelector('p');
                if(!pTag) {pTag = document.createElement('p'); currentAgentMessageElement.appendChild(pTag);}

                if (data && data.agent_response) {
                     pTag.innerHTML = data.agent_response; 
                } else if (data && typeof data === 'string') { 
                     pTag.textContent = data;
                } else {
                    pTag.textContent = "Agent sent an empty or malformed response.";
                }
                chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;

            } catch (error) {
                console.error("Fetch/Stream Error:", error);
                if (currentAgentMessageElement) {
                    let pTag = currentAgentMessageElement.querySelector('p');
                    if(!pTag) {pTag = document.createElement('p'); currentAgentMessageElement.appendChild(pTag);}
                    pTag.textContent = 'Error: Could not connect or stream from the server.';
                } else { 
                    appendMessage('Error: Could not connect or stream from the server.', 'agent-message');
                }
            } finally {
                if(sendButton) sendButton.disabled = false;
                currentAgentMessageElement = null; 
            }
        }

        function openAddDocModal() {
            if(addDocModal) addDocModal.style.display = 'block';
        }

        function closeAddDocModal() {
            if(addDocModal) addDocModal.style.display = 'none';
            if(docLinkInput) docLinkInput.value = ''; 
            if(corpusNameInput) corpusNameInput.value = '';
        }
        
        if(submitAddDocButton){
            submitAddDocButton.addEventListener('click', function() {
                const link = docLinkInput.value.trim();
                const corpus = corpusNameInput.value.trim();
                const currentLang = localStorage.getItem('preferredLanguage') || 'fr';
                if (link && corpus) {
                    queryInput.value = `add this doc as new file ${link} in ${corpus}`;
                    sendQuery();
                    closeAddDocModal();
                } else {
                    alert(translations[currentLang].alertAddDoc);
                }
            });
        }

        window.addEventListener('click', function(event) {
            if (event.target == addDocModal) closeAddDocModal();
            if (event.target == deleteItemModal) closeDeleteModal();
            if (event.target == createCorpusModal) closeCreateCorpusModal();
            if (event.target == listItemModal) closeListItemModal();
        });

        function openCreateCorpusModal() {
            if(createCorpusModal) createCorpusModal.style.display = 'block';
        }

        function closeCreateCorpusModal() {
            if(createCorpusModal) createCorpusModal.style.display = 'none';
            if(newCorpusNameInput) newCorpusNameInput.value = '';
        }

        if(submitCreateCorpusButton) {
            submitCreateCorpusButton.addEventListener('click', function() {
                const corpusName = newCorpusNameInput.value.trim();
                const currentLang = localStorage.getItem('preferredLanguage') || 'fr';
                if (corpusName) {
                    queryInput.value = `Create a new knowledge base named '${corpusName}'`;
                    sendQuery();
                    closeCreateCorpusModal();
                } else {
                    alert(translations[currentLang].alertCreateCorpus);
                }
            });
        }
        
        function openListItemModal() {
            if(listItemModal) listItemModal.style.display = 'block';
            const radioToCheck = document.querySelector('input[name="listType"][value="documentsInCorpus"]');
            if(radioToCheck) radioToCheck.checked = true;
            toggleListItemCorpusNameField();
        }

        function closeListItemModal() {
            if(listItemModal) listItemModal.style.display = 'none';
            if(listCorpusNameInput) listCorpusNameInput.value = '';
        }

        function toggleListItemCorpusNameField(lang) { 
            const currentSelectedLang = lang || localStorage.getItem('preferredLanguage') || 'fr';
            const listTypeRadio = document.querySelector('input[name="listType"]:checked');
            if (!listTypeRadio || !listItemCorpusNameContainer) return; 

            if (listTypeRadio.value === 'documentsInCorpus') {
                listItemCorpusNameContainer.style.display = 'block';
            } else { 
                listItemCorpusNameContainer.style.display = 'none';
            }
        }
        
        if(submitListItemButton) {
            submitListItemButton.addEventListener('click', function() {
                const listTypeRadio = document.querySelector('input[name="listType"]:checked');
                if (!listTypeRadio) return; 
                const listType = listTypeRadio.value;
                let prompt = '';
                const currentLang = localStorage.getItem('preferredLanguage') || 'fr';
                if (listType === 'documentsInCorpus') {
                    const corpusName = listCorpusNameInput.value.trim();
                    if (!corpusName) {
                        alert(translations[currentLang].alertListCorpusEmpty);
                        return;
                    }
                    prompt = `List all documents in the corpus '${corpusName}'`;
                } else { 
                    prompt = `List all corpora names`;
                }
                queryInput.value = prompt;
                sendQuery();
                closeListItemModal();
            });
        }

        function openDeleteModal() {
            if(deleteItemModal) deleteItemModal.style.display = 'block';
            const radioToSelect = document.querySelector('input[name="deleteType"][value="document"]');
            if(radioToSelect) radioToSelect.checked = true;
            const currentLang = localStorage.getItem('preferredLanguage') || 'fr';
            toggleDeleteCorpusNameField(currentLang); 
        }

        function closeDeleteModal() {
            if(deleteItemModal) deleteItemModal.style.display = 'none';
            if(itemNameInput) itemNameInput.value = '';
            if(deleteCorpusNameInput) deleteCorpusNameInput.value = '';
        }

        function toggleDeleteCorpusNameField(lang) {
            const currentSelectedLang = lang || localStorage.getItem('preferredLanguage') || 'fr';
            const deleteTypeRadio = document.querySelector('input[name="deleteType"]:checked');
            const itemNameLabelEl = document.getElementById('itemNameLabel'); 

            if (!deleteTypeRadio || !itemNameLabelEl || !deleteCorpusNameContainer || !itemNameInput) return; 

            if (deleteTypeRadio.value === 'document') {
                deleteCorpusNameContainer.style.display = 'block';
                if(translations[currentSelectedLang]) { 
                    itemNameLabelEl.textContent = translations[currentSelectedLang].deleteItemNameLabelDoc;
                    itemNameInput.placeholder = translations[currentSelectedLang].deleteItemNamePlaceholder; 
                }
            } else { 
                deleteCorpusNameContainer.style.display = 'none';
                 if(translations[currentSelectedLang]) {
                    itemNameLabelEl.textContent = translations[currentSelectedLang].deleteItemNameLabelCorpus;
                    itemNameInput.placeholder = translations[currentSelectedLang].deleteItemNamePlaceholder;
                 }
            }
        }
        
        if(submitDeleteItemButton) {
            submitDeleteItemButton.addEventListener('click', function() {
                const deleteTypeRadio = document.querySelector('input[name="deleteType"]:checked');
                if (!deleteTypeRadio) return; 
                const deleteType = deleteTypeRadio.value;
                const itemName = itemNameInput.value.trim();
                let prompt = '';
                const currentLang = localStorage.getItem('preferredLanguage') || 'fr';

                if (!itemName) {
                    alert(translations[currentLang].alertDeleteItemName);
                    return;
                }

                if (deleteType === 'document') {
                    const corpusNameForDoc = deleteCorpusNameInput.value.trim();
                    if (!corpusNameForDoc) {
                        alert(translations[currentLang].alertDeleteDocCorpusName);
                        return;
                    }
                    prompt = `Delete the document named '${itemName}' from the corpus '${corpusNameForDoc}'`;
                } else { 
                    prompt = `Delete the corpus named '${itemName}'`;
                }

                queryInput.value = prompt;
                sendQuery();
                closeDeleteModal();
            });
        }

        function handleVisaDocSuggestion() {
            const currentLang = localStorage.getItem('preferredLanguage') || 'fr';
            if(translations[currentLang] && queryInput) { 
                queryInput.value = translations[currentLang].prefillVisaDocs;
                queryInput.focus(); 
                autoGrow(queryInput); 
            }
        }

        function handleCountryVisaSuggestion() {
            const currentLang = localStorage.getItem('preferredLanguage') || 'fr';
             if(translations[currentLang] && queryInput) { 
                queryInput.value = translations[currentLang].prefillCountryVisa;
                queryInput.focus(); 
                autoGrow(queryInput);
             }
        }

    </script>
</body>
