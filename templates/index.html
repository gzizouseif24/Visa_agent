<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Agent Chat</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh; /* Full viewport height */
        }
        .chat-container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 700px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 100px); /* Adjust based on header/footer or other elements */
            max-height: 800px; /* Max height for very tall screens */
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            padding: 15px;
            margin: 0;
            font-size: 1.5em;
            border-bottom: 1px solid #eee;
        }
        .chat-window {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .message {
            padding: 10px 15px;
            border-radius: 18px;
            margin-bottom: 10px;
            max-width: 75%;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #3498db;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        .agent-message {
            background-color: #ecf0f1;
            color: #2c3e50;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
        }
        textarea#queryInput {
            flex-grow: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ddd;
            resize: none; /* Prevent manual resize */
            font-size: 1rem;
            margin-right: 10px;
            height: 22px; /* Initial height for single line */
            overflow-y: hidden; /* Hide scrollbar initially */
        }
        button#sendButton {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }
        button#sendButton:hover {
            background-color: #27ae60;
        }
        button#sendButton:disabled {
            background-color: #95a5a6;
        }
        .loader-chat {
            border: 3px solid rgba(0,0,0,0.1); 
            border-top: 3px solid #ffffff; 
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block; 
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>Visa Information Assistant</h1>
        <div class="chat-window" id="chatWindow">
            <!-- Messages will be appended here -->
        </div>
        <div class="input-area">
            <textarea id="queryInput" placeholder="Ask your question..." rows="1" oninput="autoGrow(this)"></textarea>
            <button onclick="sendQuery()" id="sendButton">Send</button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const queryInput = document.getElementById('queryInput');
        const sendButton = document.getElementById('sendButton');
        let currentAgentMessageElement = null;

        function autoGrow(element) {
            element.style.height = "5px";
            element.style.height = (element.scrollHeight) + "px";
            if (element.scrollHeight > 150) { // Max height for textarea
                element.style.height = "150px";
                element.style.overflowY = "auto";
            } else {
                element.style.overflowY = "hidden";
            }
        }

        queryInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendQuery();
            }
        });

        function appendMessage(text, senderClass, isStreaming = false) {
            let messageElement;
            if (isStreaming && currentAgentMessageElement && senderClass === 'agent-message') {
                messageElement = currentAgentMessageElement;
                messageElement.innerHTML += text; // Append text, not create new element
            } else {
                messageElement = document.createElement('div');
                messageElement.classList.add('message', senderClass);
                messageElement.textContent = text;
                chatWindow.appendChild(messageElement);
                if (senderClass === 'agent-message') {
                    currentAgentMessageElement = messageElement; // Store for streaming
                }
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return messageElement;
        }
        
        function showLoaderInAgentMessage() {
            currentAgentMessageElement = appendMessage("", 'agent-message');
            const loaderDiv = document.createElement('div');
            loaderDiv.classList.add('loader-chat');
            currentAgentMessageElement.appendChild(loaderDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function removeLoaderFromAgentMessage() {
            if (currentAgentMessageElement) {
                const loader = currentAgentMessageElement.querySelector('.loader-chat');
                if (loader) {
                    currentAgentMessageElement.removeChild(loader);
                }
            }
        }

        async function sendQuery() {
            const query = queryInput.value.trim();
            if (!query) return;

            appendMessage(query, 'user-message');
            queryInput.value = '';
            autoGrow(queryInput); 
            queryInput.focus();

            sendButton.disabled = true;
            showLoaderInAgentMessage(); // Show loader in a new agent bubble

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                removeLoaderFromAgentMessage(); // Remove loader once response headers are received

                if (!response.ok) {
                    const errorText = await response.text(); // Try to get raw text for error
                    currentAgentMessageElement.textContent = 'Error: ' + (errorText || response.statusText);
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let streamingDone = false;
                let firstChunk = true;

                while (!streamingDone) {
                    const { value, done } = await reader.read();
                    streamingDone = done;

                    if (value) {
                        const textChunk = decoder.decode(value, { stream: !done }); // stream: true until last chunk
                        if (firstChunk && currentAgentMessageElement.textContent === '') {
                            currentAgentMessageElement.textContent = textChunk; // Replace loader content
                            firstChunk = false;
                        } else {
                            currentAgentMessageElement.textContent += textChunk; // Append subsequent chunks
                        }
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                    }
                }
                if (currentAgentMessageElement.textContent.trim() === '') {
                     currentAgentMessageElement.textContent = "Agent finished but sent no text.";
                }

            } catch (error) {
                console.error("Fetch/Stream Error:", error);
                if (currentAgentMessageElement) {
                    currentAgentMessageElement.textContent = 'Error: Could not connect or stream from the server.';
                } else { // If error happened before agent message bubble was created
                    appendMessage('Error: Could not connect or stream from the server.', 'agent-message');
                }
            } finally {
                sendButton.disabled = false;
                currentAgentMessageElement = null; 
            }
        }
    </script>
</body>
</html>
